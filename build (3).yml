                        override fun onStart(u: String?) {}
                        override fun onDone(u: String?) { latch.countDown() }
                        override fun onError(u: String?) { latch.countDown() }
                      })
                      val params = Bundle()
                      tts?.synthesizeToFile(fala, params, wav, "u$i")
                      latch.await()
                      pares.add(Pair(bmp, wav))
                    }
