          package app.cursoia

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.util.Base64
          import android.webkit.*
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.CountDownLatch

          // Segurança: sem acesso a arquivos, contatos, apps ou banco. Rede só para os destinos listados.
          // A IA só trabalha com a autorização ativa (checado aqui no código nativo). Sem chave, tudo roda no modo Off-AI (local).
          class MainActivity : Activity() {
            private lateinit var wv: WebView
            @Volatile private var ate = 0L
            private var tts: TextToSpeech? = null
            private val HOSTS = setOf(
              "api.openai.com", "api.anthropic.com", "generativelanguage.googleapis.com", "api.groq.com",
              "suggestqueries.google.com", "pt.wikipedia.org", "public-api.kiwify.com", "api.cakto.com.br")
            private val SHOP = Regex("^[a-z0-9][a-z0-9-]*\\.myshopify\\.com$")
            private val prefs by lazy {
              EncryptedSharedPreferences.create(
                this, "cofre",
                MasterKey.Builder(this).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),
                EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM)
            }

            inner class Ponte {
              @JavascriptInterface fun ler(k: String): String = prefs.getString(k, "") ?: ""
              @JavascriptInterface fun gravar(k: String, v: String) { prefs.edit().putString(k, v).apply() }
              @JavascriptInterface fun autorizar(min: Int) { ate = if (min > 0) System.currentTimeMillis() + min * 60000L else 0L }
              @JavascriptInterface fun restante(): Long = maxOf(0L, ate - System.currentTimeMillis()) / 1000
              @JavascriptInterface fun estado(s: String) {
                Bolha.pintar(when (s) {
                  "rodando" -> 0xFF00E676.toInt(); "aguardando" -> 0xFFFFC107.toInt()
                  "parado" -> 0xFFFF5252.toInt(); else -> 0xFF9E9E9E.toInt()
                })
              }
              @JavascriptInterface fun compartilhar(txt: String) {
                runOnUiThread {
                  val i = Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, txt) }
                  startActivity(Intent.createChooser(i, "Enviar para outro app"))
                }
              }
              @JavascriptInterface fun compartilharArquivo(uriStr: String, tipo: String) {
                runOnUiThread {
                  try {
                    val i = Intent(Intent.ACTION_SEND).apply {
                      type = tipo; putExtra(Intent.EXTRA_STREAM, Uri.parse(uriStr))
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    }
                    startActivity(Intent.createChooser(i, "Postar ou enviar"))
                  } catch (e: Exception) {}
                }
              }
