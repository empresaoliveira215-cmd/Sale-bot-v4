          function resp(id,a){if(a==='idea'){$('#in').focus();return toast('Escreva sua ideia abaixo e envie')}if(a==='all')S.aceitaTodas=true;fechaAsk(id,a)}
          function pedir(titulo,txt){if(S.aceitaTodas)return Promise.resolve({ok:true});
            return new Promise(res=>{const m=post('ask',txt,{titulo,est:'aberto'});ASK[m.id]=res;estado()})}
          function pedirPlataforma(titulo,txt){return new Promise(res=>{const m=post('ask',txt,{titulo,est:'aberto',plat:true});ASK[m.id]=p=>res(p.est);estado()})}

          // ---------- Cérebro (memória) ----------
          const memAdd=t=>{t=String(t).slice(0,220);if(!S.mem.includes(t)){S.mem.push(t);S.mem=S.mem.slice(-40);save()}};

          // ---------- Rede ----------
          const pend={};
          window.retorno=(id,t)=>{const p=pend[id];delete pend[id];let r;try{r=JSON.parse(t)}catch(e){r={status:0,body:String(t)}}p(r)};
          const http=(m,u,h={},b='')=>new Promise(ok=>{const id=Math.random().toString(36).slice(2);pend[id]=ok;A.http(id,m,u,JSON.stringify(h),b)});

          // ---------- Detecção automática do provedor pela chave ----------
          const hasChave=()=>!!A.ler('chave');
          function provedor(k){
            if(/^sk-ant-/.test(k))return'anthropic';
            if(/^AIza/.test(k))return'google';
            if(/^gsk_/.test(k))return'groq';
            if(/^sk-/.test(k))return'openai';
            return'openai'}
          const NOME={openai:'OpenAI (ChatGPT)',anthropic:'Anthropic (Claude)',google:'Google (Gemini)',groq:'Groq (Llama)'};

          // ---------- IA ----------
          const SYS=`Você é o Vendedor YoYo, estrategista sênior e criador de infoprodutos para o mercado brasileiro, com mentalidade de produto e copywriting honesto.
          Método: 1) entenda o público e as dores reais; 2) ache lacunas e um ângulo original; 3) estruture do básico ao resultado prático; 4) cada aula segue: gancho, conceito, exemplo real, prática, resumo; 5) venda com clareza (problema, solução, prova possível, garantia, chamada), sem exagero.
          Seja específico; evite generalidades; pense antes de responder e revise o próprio texto.
          Regras: nunca copie conteúdo de terceiros, use tendências só como inspiração. Não invente fatos, números, estudos, experiência nem depoimentos; se não souber, diga. Não prometa ganhos garantidos. Em saúde, finanças e jurídico, só conteúdo educacional com aviso. Cursos custam de R$ 10 a R$ 50. Responda em português do Brasil.`;
          const sys=()=>SYS+(S.mem.length?'\n\nMemória do usuário e aprendizados (respeite):\n- '+S.mem.slice(-12).join('\n- ').slice(0,1500):'');
          async function ia(msgs){
            const k=A.ler('chave');if(!k)return iaOff(msgs);
            const prov=provedor(k);
            if(prov==='anthropic'){
              const r=await http('POST','https://api.anthropic.com/v1/messages',{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01'},
                JSON.stringify({model:'claude-3-5-haiku-20241022',max_tokens:3000,system:sys(),messages:msgs.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}))}));
              if(r.status===0)throw new Error(r.body);if(r.status<200||r.status>=300)throw new Error('Anthropic '+r.status+': '+String(r.body).slice(0,160));
              return JSON.parse(r.body).content[0].text}
            if(prov==='google'){
              const contents=msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
              const r=await http('POST',`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`,{'content-type':'application/json'},
                JSON.stringify({contents,systemInstruction:{parts:[{text:sys()}]}}));
              if(r.status===0)throw new Error(r.body);if(r.status<200||r.status>=300)throw new Error('Google '+r.status+': '+String(r.body).slice(0,160));
              return JSON.parse(r.body).candidates[0].content.parts[0].text}
            const url=prov==='groq'?'https://api.groq.com/openai/v1/chat/completions':'https://api.openai.com/v1/chat/completions';
            const modelo=prov==='groq'?'llama-3.3-70b-versatile':(A.ler('omod')||'gpt-4o-mini');
            const r=await http('POST',url,{'Content-Type':'application/json',Authorization:'Bearer '+k},JSON.stringify({model:modelo,messages:[{role:'system',content:sys()},...msgs]}));
            if(r.status===0)throw new Error(r.body);if(r.status<200||r.status>=300)throw new Error(NOME[prov]+' '+r.status+': '+String(r.body).slice(0,160));
            try{return JSON.parse(r.body).choices[0].message.content}catch(e){throw new Error('Resposta inesperada de '+NOME[prov]+'.')}}
          const pj=t=>{const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error('sem json');return JSON.parse(m[0])};
          async function iaJson(p){let h=[{role:'user',content:p+'\n\nResponda SOMENTE com JSON válido, sem texto fora do JSON.'}],t;
            for(let i=0;i<3;i++){t=await ia(h);try{return pj(t)}catch(e){h=[...h,{role:'assistant',content:t},{role:'user',content:'Seu JSON estava inválido. Reenvie SOMENTE o JSON corrigido e completo.'}]}}
            throw new Error('A IA não devolveu JSON válido.')}

          // ---------- Off-AI: gera tudo localmente, sem nenhuma chave, usando a pesquisa real ----------
          const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
          function linhasPesq(pesq){return String(pesq).split('\n').filter(l=>l.startsWith('- ')).map(l=>l.slice(2)).filter(l=>l.length>3)}
          async function iaOff(){return'(Off-AI não responde perguntas livres; use o fluxo de Criar curso ou cadastre uma chave em Ajustes para conversar livremente.)'}
          function offEstrategia(tema,pesq){
            const L=linhasPesq(pesq),t=cap(tema);
            const dores=(L.length?L:[`dificuldade para começar com ${tema}`,`falta de um passo a passo claro sobre ${tema}`]).slice(0,5).map(cap);
            const preco=[19,29,35,45][Math.abs(tema.length*7)%4];
            return{publico:`Pessoas iniciantes e intermediárias que buscam ${tema} e querem um caminho prático, sem enrolação.`,
              nivel:'iniciante a intermediário',dores,lacunas:dores.slice(0,3).map(d=>'Falta de material objetivo sobre: '+d),
              angulo:`Um método direto e sequencial para ${tema}, com exercícios práticos em cada etapa, sem depender de teoria longa.`,
              titulos:[`${t}: Guia Prático do Zero`,`Domine ${t} em Etapas Simples`,`${t} na Prática`,`Método Direto: ${t}`,`${t} Sem Complicação`],
              titulo_escolhido:`${t}: Guia Prático do Zero`,subtitulo:`Um caminho claro e direto para aprender ${tema}, com exercícios em cada etapa.`,
              promessa:`Você vai sair com uma base prática sobre ${tema} e exercícios para aplicar logo. Resultado depende da sua prática; sem promessa de ganho.`,
              preco,nota_nicho:Math.min(10,Math.max(4,L.length?Math.round(L.length/4):5)),riscos:'Conteúdo educacional; nenhuma garantia de resultado financeiro.'}}
          function offOutline(estr,tema){const d=estr.dores;
            return{modulos:[
              {nome:'Fundamentos',objetivo:'Entender a base antes de praticar',aulas:[`O que é ${tema} e por onde começar`,`Erros comuns ao lidar com ${d[0]||tema}`,'Ferramentas e preparação inicial']},
              {nome:'Aplicação Prática',objetivo:'Colocar a mão na massa',aulas:[`Passo a passo prático de ${tema}`,`Como resolver: ${d[1]||'o problema mais comum'}`,'Exercício guiado completo']},
              {nome:'Resultados e Próximos Passos',objetivo:'Consolidar e avançar',aulas:['Como revisar e corrigir o que não funcionou','Checklist final de qualidade','Para onde ir depois deste curso']}]}}
          function offAula(titulo,tema){
            return{titulo,resumo:`Aula prática sobre ${titulo.toLowerCase()}.`,
              roteiro:`Gancho: você já se perguntou como avançar em "${titulo}"? Vamos direto ao ponto.\n\nConceito: dentro de ${tema}, este tema aparece sempre que alguém tenta sair do básico sem um guia. A ideia aqui é simplificar, dividindo o problema em partes pequenas e testáveis.\n\nExemplo prático: pegue o menor passo possível relacionado a "${titulo}" e execute hoje, cronometrando o tempo gasto; isso revela onde está a real dificuldade.\n\nPrática: anote 3 tentativas, o que funcionou e o que travou, e repita ajustando apenas uma variável por vez.\n\nResumo: o ganho vem da repetição com ajuste, não da teoria. Guarde suas anotações para a próxima aula.`,
              exercicio:`Aplique "${titulo}" em uma situação real sua hoje e anote o resultado em 3 frases.`}}
          function offVenda(estr,outline,tema){
            const beneficios=outline.modulos.map(m=>'Você vai aprender: '+m.nome.toLowerCase());
            return{pagina_vendas:`${estr.titulo_escolhido}\n\n${estr.promessa}\n\nSe você sente ${(estr.dores[0]||'dificuldade com '+tema).toLowerCase()}, este curso foi feito para te dar um caminho prático, direto e sem enrolação.\n\nO que você vai aprender:\n- ${beneficios.join('\n- ')}\n\nPara quem é: ${estr.publico}\n\nGarantia: 7 dias para pedir reembolso se não fizer sentido para você.\n\nComece hoje e dê o próximo passo em ${tema}.`,
              faq:[{p:'Preciso de experiência prévia?',r:'Não, o curso começa do básico.'},{p:'Quanto tempo leva para concluir?',r:'No seu ritmo; o conteúdo é dividido em etapas curtas.'},{p:'Tem garantia?',r:'Sim, 7 dias.'},{p:'O curso garante resultado financeiro?',r:'Não. É conteúdo educacional; o resultado depende da sua prática.'},{p:'Como recebo o acesso?',r:'Pela plataforma onde você comprou.'}],
              anuncios:[`Quer aprender ${tema} do jeito prático? ${estr.titulo_escolhido} por R$ ${estr.preco}.`,`Cansado de teoria sobre ${tema}? Esse curso é só prática. Link na bio.`,`${estr.titulo_escolhido}: um passo de cada vez, sem enrolação.`],
              bonus:['Checklist de ação em PDF','Planilha de acompanhamento de progresso','Lista de próximos passos após o curso']}}
          const ICONES=['grafico','livro','raio','alvo','moeda','check'];
          function offExtra(estr,outline,tema){
            const idx=Math.abs(tema.length)%ICONES.length;
            const capa={cor1:'#1B1740',cor2:'#3A2E8F',acento:'#F5B544',selo:'PASSO A PASSO',icone:ICONES[idx],titulo_capa:estr.titulo_escolhido.split(':')[0].slice(0,30)};
            const slides=[{titulo:estr.titulo_escolhido,pontos:[estr.subtitulo],fala:`Bem-vindo ao curso ${estr.titulo_escolhido}.`},
              {titulo:'O problema',pontos:estr.dores.slice(0,3),fala:'Estas são as dificuldades mais comuns que vamos resolver.'},
              {titulo:'A promessa',pontos:[estr.promessa],fala:estr.promessa},
              {titulo:'O método',pontos:[estr.angulo],fala:'Este é o método que vamos seguir, passo a passo.'},
              ...outline.modulos.map(m=>({titulo:m.nome,pontos:m.aulas,fala:'Neste módulo, '+m.objetivo.toLowerCase()+'.'})),
              {titulo:'Bônus inclusos',pontos:['Checklist de ação','Planilha de acompanhamento','Lista de próximos passos'],fala:'Você também recebe estes bônus.'},
              {titulo:'Para quem é',pontos:[estr.publico],fala:'Este curso é para você que busca um caminho prático.'},
              {titulo:'Comece agora',pontos:[`R$ ${estr.preco} · Garantia de 7 dias`],fala:'Garanta o seu acesso agora e comece hoje mesmo.'}];
            return{capa,slides}}

          // ---------- Pesquisa gratuita (sem chave nenhuma): Google Suggest + Wikipédia ----------
          async function sugestoes(q){const r=await http('GET','https://suggestqueries.google.com/complete/search?client=firefox&hl=pt-BR&q='+encodeURIComponent(q));try{return JSON.parse(r.body)[1]||[]}catch(e){return[]}}
          async function wiki(q){const r=await http('GET','https://pt.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=3&srsearch='+encodeURIComponent(q));
            try{return JSON.parse(r.body).query.search.map(s=>s.title+': '+s.snippet.replace(/<[^>]+>/g,'')).join('\n')}catch(e){return''}}
          async function pesquisar(t){
            const qs=[t,'como '+t,'curso de '+t,t+' para iniciantes','melhor '+t,'quanto custa '+t,t+' passo a passo','erros em '+t,'por que '+t];
            const s=[...new Set((await Promise.all(qs.map(sugestoes))).flat())].slice(0,45);
            return `Buscas reais no Google Brasil (mostram demanda e dúvidas):\n- ${s.join('\n- ')}\n\nContexto (Wikipédia):\n${await wiki(t)}`}

          // ---------- Produção em etapas, cada uma com a sua aprovação ----------
          const PARADO=new Error('parado'),RECUSOU=new Error('recusou');
          const gate=()=>{if(!S.rodando)throw PARADO};
          const sj=()=>save();
          const idt=j=>(j.ideias&&j.ideias.length)?'\nIdeias do usuário para incorporar: '+j.ideias.join(' | '):'';
          async function passo(j,k,titulo,desc,fn){
            if(j[k])return;gate();
            const r=await pedir(titulo,desc);if(!r.ok)throw r.est==='no'?RECUSOU:PARADO;
            if(r.ideia){j.ideias=[...(j.ideias||[]),r.ideia];memAdd('Ideia do usuário ('+j.tema+'): '+r.ideia)}
            const m=etapa(titulo+'...');
            try{j[k]=await fn(idt(j));fim(m,'ok');sj()}catch(e){fim(m,'err');throw e}}
          async function produzir(){
            const j=S.job;
            if(!j.plataforma){gate();j.plataforma=await pedirPlataforma('Onde vender?','Em qual plataforma você quer vender este curso? Na Cakto, eu consigo postar o produto automaticamente em um clique.')}
            await passo(j,'pesq','Pesquisar a demanda',`Vou consultar as buscas reais do Google Brasil e a Wikipédia sobre **${j.tema}**.`,()=>pesquisar(j.tema));
            await passo(j,'estr','Estratégia e ângulo original','Vou definir público, dores, ângulo, título e preço (R$ 10 a R$ 50).',id=>hasChave()?iaJson(`Tema: ${j.tema}\n${j.pesq}${id}\n\nFaça a estratégia de um curso ORIGINAL. Formato:
          {"publico":"","nivel":"","dores":["","","","",""],"lacunas":["","",""],"angulo":"","titulos":["","","","",""],"titulo_escolhido":"","subtitulo":"","promessa":"(sem garantia de ganhos)","preco":29,"nota_nicho":0,"riscos":""} Preço entre 10 e 50.`):Promise.resolve(offEstrategia(j.tema,j.pesq)));
            await passo(j,'outline','Estrutura do curso',`Vou montar os módulos e aulas de **${j.estr.titulo_escolhido}**.`,id=>hasChave()?iaJson(`Curso: ${j.estr.titulo_escolhido}\nPúblico: ${j.estr.publico}\nDores: ${(j.estr.dores||[]).join('; ')}${id}\n\nFormato: {"modulos":[{"nome":"","objetivo":"","aulas":["","",""]}]} com 3 módulos de 3 aulas.`):Promise.resolve(offOutline(j.estr,j.tema)));
            await passo(j,'aulas','Escrever as aulas',`Vou escrever o conteúdo de ${j.outline.modulos.length} módulos.`,async id=>{
              j.mods=j.mods||[];const n=j.outline.modulos.length;
              for(let i=j.mods.length;i<n;i++){gate();say(`Escrevendo o módulo ${i+1} de ${n}...`);const m=j.outline.modulos[i];
                if(hasChave())j.mods.push(await iaJson(`Curso: ${j.estr.titulo_escolhido}\nMódulo ${i+1}: ${m.nome}. Objetivo: ${m.objetivo}\nAulas: ${m.aulas.join(' | ')}${id}\n\nFormato: {"nome":"${m.nome.replace(/"/g,"'")}","aulas":[{"titulo":"","resumo":"","roteiro":"(200-350 palavras)","exercicio":""}]}`));
                else j.mods.push({nome:m.nome,aulas:m.aulas.map(a=>offAula(a,j.tema))});
                sj()}return 1});
            await passo(j,'venda','Página de vendas, FAQ e anúncios','Vou escrever a copy, o FAQ, anúncios e bônus.',async id=>{
              if(!hasChave())return offVenda(j.estr,j.outline,j.tema);
              const v=await iaJson(`Curso: ${j.estr.titulo_escolhido}\nPúblico: ${j.estr.publico}\nDores: ${(j.estr.dores||[]).join('; ')}\nPromessa: ${j.estr.promessa}${id}\n\nFormato: {"pagina_vendas":"","faq":[{"p":"","r":""}],"anuncios":["","",""],"bonus":["","",""]} com 5 perguntas no FAQ.`);
              try{const t=await ia([{role:'user',content:`Revise removendo promessas exageradas e garantias de ganho, mantendo persuasivo e honesto. Devolva SOMENTE o texto revisado.\n\n${v.pagina_vendas}`}]);if(t.length>200)v.pagina_vendas=t}catch(e){}
              return v});
            await passo(j,'extra','Capa e slides','Vou criar a capa e um roteiro de slides.',async id=>hasChave()?{
                capa:await iaJson(`Curso: ${j.estr.titulo_escolhido}${id}\nFormato: {"cor1":"#1B1740","cor2":"#3A2E8F","acento":"#F5B544","selo":"(até 3 palavras)","icone":"grafico|livro|raio|alvo|moeda|check","titulo_capa":"(até 6 palavras)"}`),
                slides:(await iaJson(`Curso: ${j.estr.titulo_escolhido}\nMódulos: ${j.outline.modulos.map(m=>m.nome).join('; ')}${id}\nCrie 10 slides (capa, problema, promessa, método, módulos, bônus, para quem é, chamada). Formato: {"slides":[{"titulo":"","pontos":["","",""],"fala":"(1-2 frases)"}]}`)).slides||[]}
              :offExtra(j.estr,j.outline,j.tema));
            const e=j.estr,v=j.venda,x=j.extra,c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,4),tema:j.tema,data:new Date().toLocaleDateString('pt-BR'),plataforma:j.plataforma,titulo:e.titulo_escolhido,subtitulo:e.subtitulo,publico:e.publico,promessa:e.promessa,preco:e.preco,nota:e.nota_nicho,modulos:j.mods,bonus:v.bonus,pagina_vendas:v.pagina_vendas,faq:v.faq,anuncios:v.anuncios,capa:x.capa,slides:x.slides};
            S.cursos.unshift(c);save();
            post('ai',`Curso pronto: **${c.titulo}**\nPlataforma: ${PLAT[c.plataforma]} · Preço sugerido: R$ ${preco(c)}.\n${c.plataforma==='cakto'?'É só tocar em "Postar na Cakto" para publicar em um clique.':'Capa, slides, página de vendas e anúncios estão em Cursos.'} Também dá para gerar um vídeo narrado lá.`,{bt:[['Ver curso','ver:']]});
            if(hasChave())try{const l=await iaJson(`Curso criado: ${c.titulo} (tema ${j.tema}).\nEscreva 2 aprendizados curtos. Formato: {"licoes":["",""]}`);(l.licoes||[]).slice(0,2).forEach(t=>memAdd('Aprendizado: '+t))}catch(x){}}
          async function loop(){S.rodando=true;if(S.loop){estado();return}S.loop=true;estado();renderFeed();
            try{while(S.fila.length&&S.rodando){if(!S.job){S.job={tema:S.fila[0]};sj()}
                await produzir();S.fila.shift();S.job=null;sj()}
              if(!S.fila.length)post('ai','Terminei tudo que estava na fila.')}
            catch(e){post('ai',e===PARADO?'Parei. Toque em Continuar quando quiser que eu siga de onde parei.':e===RECUSOU?'Ok, não fiz essa etapa. Mande uma ideia ou toque em Continuar.':'Tive um erro: '+e.message+'. Toque em Continuar para tentar de novo.')}
            S.loop=false;S.rodando=false;estado();renderFeed()}
          function iniciar(temas){S.aceitaTodas=false;S.fila.push(...temas);sj();post('ai',`Certo! Vou criar ${temas.length>1?temas.length+' cursos':'o curso'}. Antes de cada etapa eu peço a sua aprovação.`);loop()}
          async function auto(n){S.busy=true;renderFeed();
            try{const sem=['como ganhar dinheiro com','curso online de','aprender','como começar a','melhor forma de'];
              const c=[...new Set((await Promise.all(sem.map(sugestoes))).flat())].filter(x=>x.length>12).sort(()=>Math.random()-.5).slice(0,14);
              if(!c.length)throw new Error('Não consegui buscar temas agora.');
              let t;if(hasChave()){const r=await iaJson(`Candidatos:\n- ${c.join('\n- ')}\n\nEscolha os ${n} melhores para um curso de R$ 10 a R$ 50 (demanda clara, baixo risco, sem dinheiro fácil/saúde/jurídico). Formato: {"escolhidos":["",...]}`);t=(r.escolhidos||c).slice(0,n)}else t=c.slice(0,n);
              S.busy=false;renderFeed();
              const a=await pedir('Escolher os temas','Escolhi estes temas pelo maior potencial:\n- '+t.join('\n- '));
              if(!a.ok)return post('ai','Tudo bem, não vou produzir esses temas.');
              if(a.ideia)t=[a.ideia,...t].slice(0,n);iniciar(t)}
            catch(e){post('ai','Erro: '+e.message)}S.busy=false;renderFeed()}

          // ---------- Afiliação ----------
          async function afil(modo,entrada){
            const perfil=localStorage.getItem('perfil')||'';
            const base=`Perfil REAL do afiliado (use só isto; nunca invente experiência, resultados, números; onde faltar, escreva [PREENCHER]):\n${perfil||'(não informado)'}\n\n`;
            const T={afil_pedido:`Produto/produtor: ${entrada}\nEscreva: (1) mensagem curta e profissional pedindo afiliação; (2) plano de divulgação honesto; (3) respostas prontas sobre métodos e volume esperado.`,
              afil_resp:`Mensagem do produtor:\n"${entrada}"\nEscreva uma resposta profissional e experiente, explicando os métodos de divulgação com base só no perfil, sem exagero.`,
              afil_kit:`Produto: ${entrada}\nCrie: 5 posts, 3 roteiros de vídeo curto, 1 e-mail e 3 respostas para objeções. Sem escassez falsa nem depoimentos inventados.`}[modo];
            if(!hasChave())return post('ai','A afiliação com texto personalizado precisa de uma chave de IA em Ajustes (Off-AI não gera isso). Posso te ajudar a criar o curso enquanto isso.');
            S.busy=true;renderFeed();
            try{const t=await ia([{role:'user',content:base+T}]);const p=post('ai',t+'\n\n**Revise antes de usar.** O app não envia mensagens por você.');
              p.bt=[['Copiar','copiar:'+p.id],['Enviar a outro app','share:'+p.id]];save()}
            catch(e){post('ai','Erro: '+e.message)}S.busy=false;renderFeed()}

          // ---------- Capa ----------
          const hex=(c,d)=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:d;
          const quebra=(t,n)=>{const w=String(t).split(/\s+/),l=[];let a='';w.forEach(x=>{if((a+' '+x).trim().length>n&&a){l.push(a);a=x}else a=(a+' '+x).trim()});if(a)l.push(a);return l.slice(0,5)};
          const ICO={grafico:'M18 80 L38 56 L52 66 L82 28 M70 28 H82 V40',livro:'M20 30 H48 V78 H20 Z M52 30 H80 V78 H52 Z',raio:'M54 16 L28 54 H48 L44 84 L74 44 H54 Z',alvo:'M50 18 A32 32 0 1 0 50.1 18 M50 34 A16 16 0 1 0 50.1 34 M50 48 A2 2 0 1 0 50.1 48',moeda:'M50 18 A32 32 0 1 0 50.1 18 M50 34 V66 M58 40 H44 Q38 40 38 46 Q38 52 46 52 H54 Q62 52 62 58 Q62 64 54 64 H40',check:'M22 52 L42 72 L80 28'};
          function capaSVG(c){const k=c.capa||{},c1=hex(k.cor1,'#1B1740'),c2=hex(k.cor2,'#3A2E8F'),ac=hex(k.acento,'#F5B544');
            const L=quebra(k.titulo_capa||c.titulo,12),fs=L.length>3?88:100,sub=quebra(c.subtitulo||'',34).slice(0,2),selo=String(k.selo||'CURSO').toUpperCase().slice(0,22);
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="1000" height="1000" fill="url(#g)"/><circle cx="880" cy="160" r="280" fill="${ac}" opacity=".13"/><circle cx="110" cy="920" r="330" fill="#fff" opacity=".06"/>
          <rect x="70" y="70" width="${selo.length*24+64}" height="64" rx="32" fill="${ac}"/><text x="102" y="113" font-family="Arial,sans-serif" font-weight="800" font-size="30" fill="#1b1200" letter-spacing="2">${esc(selo)}</text>
          <g transform="translate(750,90) scale(1.9)" fill="none" stroke="${ac}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="${ICO[k.icone]||ICO.check}"/></g>
          ${L.map((l,i)=>`<text x="70" y="${330+i*(fs+12)}" font-family="Georgia,serif" font-weight="700" font-size="${fs}" fill="#fff">${esc(l)}</text>`).join('')}
          ${sub.map((l,i)=>`<text x="70" y="${340+L.length*(fs+12)+i*46}" font-family="Arial,sans-serif" font-size="34" fill="#fff" opacity=".85">${esc(l)}</text>`).join('')}
          <rect x="70" y="900" width="150" height="8" rx="4" fill="${ac}"/><text x="70" y="950" font-family="Arial,sans-serif" font-size="28" fill="#fff" opacity=".7">CURSO DIGITAL · CRIADO COM IA</text></svg>`}
          const capaURL=c=>'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(capaSVG(c))));
          function salvarCapa(id){const c=S.cursos.find(x=>x.id==id),img=new Image();
            img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=1000;cv.getContext('2d').drawImage(img,0,0,1000,1000);
              const r=A.salvarImagem(cv.toDataURL('image/png').split(',')[1],'capa_'+String(id).replace(/[^a-z0-9]/gi,''));
              toast(r==='ok'?'Capa salva na galeria (Pictures/VendedorYoYo)':r==='indisponivel'?'Seu Android é antigo para salvar direto':'Não foi possível salvar')};img.src=capaURL(c)}
          const slidesHTML=c=>`<div class="sl">${(c.slides||[]).map((s,i)=>`<div class="sd" style="background:linear-gradient(135deg,${hex(c.capa&&c.capa.cor1,'#1B1740')},${hex(c.capa&&c.capa.cor2,'#3A2E8F')})"><small>${i+1}/${c.slides.length}</small><b>${esc(s.titulo)}</b><ul>${(s.pontos||[]).slice(0,4).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`).join('')}</div>`;
          const slidesTxt=c=>(c.slides||[]).map((s,i)=>`Slide ${i+1}: ${s.titulo}\n${(s.pontos||[]).map(p=>'- '+p).join('\n')}\nFala: ${s.fala||''}`).join('\n\n');

          // ---------- Vídeo narrado ----------
          function renderSlidePNG(c,s){return new Promise(ok=>{
            const cv=document.createElement('canvas');cv.width=1280;cv.height=720;const g=cv.getContext('2d');
            const grad=g.createLinearGradient(0,0,1280,720);grad.addColorStop(0,hex(c.capa&&c.capa.cor1,'#1B1740'));grad.addColorStop(1,hex(c.capa&&c.capa.cor2,'#3A2E8F'));
            g.fillStyle=grad;g.fillRect(0,0,1280,720);
            g.fillStyle=hex(c.capa&&c.capa.acento,'#F5B544');g.font='bold 54px Georgia';g.textBaseline='top';
            const tl=quebra(s.titulo,22);tl.forEach((l,i)=>g.fillText(l,70,70+i*62));
            g.fillStyle='#fff';g.font='32px Arial';
            let y=70+tl.length*62+40;(s.pontos||[]).slice(0,4).forEach(p=>{quebra('• '+p,46).forEach(l=>{g.fillText(l,70,y);y+=42})});
            g.fillStyle='rgba(255,255,255,.55)';g.font='22px Arial';g.fillText('CRIADO COM IA',70,660);
            ok(cv.toDataURL('image/png').split(',')[1])})}
          const vidPend={};
          window.retornoVideo=(id,t)=>{const p=vidPend[id];delete vidPend[id];let r;try{r=JSON.parse(t)}catch(e){r={ok:false,erro:'Falha'}}p(r)};
          async function criarVideoCurso(id){const c=S.cursos.find(x=>x.id==id);
            if(!c.slides||!c.slides.length)return toast('Este curso ainda não tem slides.');
            const vid={id:Date.now().toString(36),titulo:c.titulo,status:'gerando',data:new Date().toLocaleDateString('pt-BR')};
            S.videos.unshift(vid);save();S.tab='videos';render();toast('Gerando vídeo (leva cerca do tempo da narração)...');
            try{const slides=[];for(const s of c.slides){const png=await renderSlidePNG(c,s);slides.push({png,fala:s.fala||s.titulo})}
              const r=await new Promise(ok=>{vidPend[vid.id]=ok;A.criarVideo(vid.id,JSON.stringify({titulo:c.titulo,slides}))});
              if(r.ok){vid.status='pronto';vid.uri=r.uri}else{vid.status='erro';vid.erro=r.erro}}
            catch(e){vid.status='erro';vid.erro=e.message}
            save();render()}
          function vVideos(){
            $('#main').innerHTML=`<div class="card"><h3>Vídeos narrados</h3><p class="mut">Gerados no próprio celular, por voz, a partir dos slides. Sempre marcados como criados com IA. Baixe e poste você mesmo no YouTube, TikTok ou Instagram — o app não posta sozinho.</p></div>`+
              (S.videos.length?S.videos.map(v=>`<div class="card"><h3>${esc(v.titulo)}</h3><span class="badge">CRIADO COM IA</span> <span class="mut">${esc(v.data)}</span>
                <div class="row">${v.status==='gerando'?'<span class="mut">Gerando...</span>':v.status==='pronto'?`<button class="go" onclick="A.compartilharArquivo('${v.uri}','video/mp4')">Baixar / Postar</button>`:`<span class="err">Erro: ${esc(v.erro||'')}</span>`}
                <button class="sec" onclick="S.videos=S.videos.filter(x=>x.id!='${v.id}');save();render()">Remover da lista</button></div></div>`).join('')
              :'<div class="card"><p class="mut">Nenhum vídeo ainda. Vá em Cursos e toque em "Criar vídeo narrado".</p></div>')}

          // ---------- Utilidades ----------
          const preco=c=>Math.min(50,Math.max(10,Math.round(Number(String(c.preco).replace(',','.').replace(/[^\d.]/g,''))||29)));
          function textoCurso(c){
            let s=`${c.titulo}\n${c.subtitulo}\n\nPúblico: ${c.publico}\nPromessa: ${c.promessa}\nPreço sugerido: R$ ${preco(c)}\n\n`;
            (c.modulos||[]).forEach((m,i)=>{s+=`MÓDULO ${i+1}: ${m.nome}\n`;(m.aulas||[]).forEach((a,j)=>{s+=`\n Aula ${i+1}.${j+1} - ${a.titulo}\n ${a.roteiro}\n Exercício: ${a.exercicio||''}\n`});s+='\n'});
            s+=`BÔNUS:\n- ${(c.bonus||[]).join('\n- ')}\n\nPÁGINA DE VENDAS:\n${c.pagina_vendas}\n\nFAQ:\n`;
            (c.faq||[]).forEach(f=>s+=`P: ${f.p}\nR: ${f.r}\n\n`);s+=`ANÚNCIOS:\n- ${(c.anuncios||[]).join('\n- ')}`;return s}
          const htmlCurso=c=>`<p>${esc(c.subtitulo)}</p><div>${esc(c.pagina_vendas).replace(/\n/g,'<br>')}</div><h3>Conteúdo</h3><ul>${(c.modulos||[]).map(m=>`<li><b>${esc(m.nome)}</b><ul>${(m.aulas||[]).map(a=>`<li>${esc(a.titulo)}</li>`).join('')}</ul></li>`).join('')}</ul>`;
          function copiar(txt){const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copiado')}catch(e){toast('Não foi possível copiar')}t.remove()}
          function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ac);color:#241a00;padding:10px 18px;border-radius:20px;font-weight:600;z-index:30;max-width:90%;text-align:center;animation:up .3s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
          const confirmar=m=>new Promise(ok=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:24px';
            d.innerHTML=`<div class="card" style="max-width:360px"><h3>Confirmar</h3><p class="mut">${esc(m)}</p><div class="row"><button class="go" id="cy">Sim</button><button class="sec" id="cn">Cancelar</button></div></div>`;
            document.body.appendChild(d);d.querySelector('#cy').onclick=()=>{d.remove();ok(true)};d.querySelector('#cn').onclick=()=>{d.remove();ok(false)}});
          function compartilharCurso(id){const c=S.cursos.find(x=>x.id==id);A.compartilhar('Crie slides profissionais e bonitos, em português, para este curso:\n\n'+slidesTxt(c))}

          // ---------- Kiwify (somente leitura) ----------
          let KT=null;
          async function kiwToken(){if(KT&&KT.exp>Date.now())return KT.t;const id=A.ler('kid'),sec=A.ler('ksec');
            if(!id||!sec)throw new Error('Cadastre client_id e client_secret da Kiwify em Ajustes.');
            const r=await http('POST','https://public-api.kiwify.com/v1/oauth/token',{'Content-Type':'application/x-www-form-urlencoded'},'client_id='+encodeURIComponent(id)+'&client_secret='+encodeURIComponent(sec));
            if(r.status===0)throw new Error(r.body);if(r.status!==200)throw new Error('A Kiwify recusou as credenciais ('+r.status+').');
            KT={t:JSON.parse(r.body).access_token,exp:Date.now()+3.5e6};return KT.t}
          async function kiw(path){const h={Authorization:'Bearer '+await kiwToken()};const a=A.ler('kacc');if(a)h['x-kiwify-account-id']=a;
            const r=await http('GET','https://public-api.kiwify.com/v1'+path,h);
            if(r.status<200||r.status>299)throw new Error('Kiwify '+r.status+': '+String(r.body).slice(0,140));return JSON.parse(r.body)}
          const lista=j=>j.data||j.results||j.products||j.items||(Array.isArray(j)?j:[]);
          async function painelKiwify(){S.busy=true;S.loja='Consultando a Kiwify...';render();
            try{const f=new Date(),i=new Date(Date.now()-30*864e5);const d=x=>x.toISOString().slice(0,10);
              const [p,v]=await Promise.all([kiw('/products?page_size=20'),kiw(`/sales?start_date=${d(i)}&end_date=${d(f)}&page_size=50`)]);
              const ps=lista(p),vs=lista(v);
              S.loja=`<b>${ps.length}</b> produtos e <b>${vs.length}</b> vendas nos últimos 30 dias.<br><br>`+ps.slice(0,10).map(x=>'• '+esc(x.name||x.title||x.id)).join('<br>')}
            catch(e){S.loja='<span class="err">'+esc(e.message)+'</span>'}S.busy=false;render()}

          // ---------- Shopify (rascunho, com confirmação) ----------
          async function shop(q,v){const d=A.ler('sdom'),t=A.ler('stok');if(!d||!t)throw new Error('Cadastre a loja e o token da Shopify em Ajustes.');
            const r=await http('POST',`https://${d}/admin/api/2025-01/graphql.json`,{'Content-Type':'application/json','X-Shopify-Access-Token':t},JSON.stringify({query:q,variables:v}));
            if(r.status===0)throw new Error(r.body);if(r.status!==200)throw new Error('Shopify '+r.status+': '+String(r.body).slice(0,120));
            const j=JSON.parse(r.body);if(j.errors)throw new Error(JSON.stringify(j.errors).slice(0,160));return j.data}
          async function enviarShopify(id){const c=S.cursos.find(x=>x.id==id);
            if(!await confirmar(`Criar o produto "${c.titulo}" como rascunho na sua Shopify por R$ ${preco(c)}?`))return;
            toast('Enviando para a Shopify...');
            try{const a=(await shop(`mutation($p:ProductCreateInput!){productCreate(product:$p){product{id variants(first:1){nodes{id}}}userErrors{message}}}`,
                {p:{title:c.titulo,descriptionHtml:htmlCurso(c),status:'DRAFT',tags:['curso-digital','vendedor-yoyo']}})).productCreate;
              if(a.userErrors.length)throw new Error(a.userErrors[0].message);
              const b=(await shop(`mutation($i:ID!,$v:[ProductVariantsBulkInput!]!){productVariantsBulkUpdate(productId:$i,variants:$v){userErrors{message}}}`,
                {i:a.product.id,v:[{id:a.product.variants.nodes[0].id,price:String(preco(c)),inventoryItem:{requiresShipping:false}}]})).productVariantsBulkUpdate;
              if(b.userErrors.length)throw new Error(b.userErrors[0].message);
              c.shopify=true;save();render();toast('Rascunho criado na Shopify')}
            catch(e){toast('Erro: '+e.message)}}

          // ---------- Cakto (produto + checkout criados em 1 clique, API oficial de escrita) ----------
          let CKT=null;
          async function caktoToken(){if(CKT&&CKT.exp>Date.now())return CKT.t;const id=A.ler('cid'),sec=A.ler('csec');
            if(!id||!sec)throw new Error('Cadastre client_id e client_secret da Cakto em Ajustes.');
            const r=await http('POST','https://api.cakto.com.br/public_api/token/',{'Content-Type':'application/x-www-form-urlencoded'},'client_id='+encodeURIComponent(id)+'&client_secret='+encodeURIComponent(sec));
            if(r.status===0)throw new Error(r.body);if(r.status!==200)throw new Error('A Cakto recusou as credenciais ('+r.status+').');
            const j=JSON.parse(r.body);CKT={t:j.access_token,exp:Date.now()+(j.expires_in?j.expires_in*900:3.5e6)};return CKT.t}
          async function enviarCakto(id){const c=S.cursos.find(x=>x.id==id);
            if(!await confirmar(`Postar "${c.titulo}" na Cakto agora por R$ ${preco(c)}? Isso cria o produto, o checkout e o link de pagamento reais, em um clique.`))return;
            toast('Postando na Cakto...');
            try{const tok=await caktoToken();
              const r=await http('POST','https://api.cakto.com.br/public_api/products/',{'Content-Type':'application/json',Authorization:'Bearer '+tok},
                JSON.stringify({name:c.titulo.slice(0,255),description:(c.pagina_vendas||c.subtitulo||'').slice(0,4000),price:String(preco(c)),type:'unique',guarantee:7,affiliate:true,paymentMethods:['pix','credit_card','boleto'],contentDeliveries:['cakto_v3']}));
              if(r.status===0)throw new Error(r.body);
              if(r.status!==201)throw new Error('Cakto '+r.status+': '+String(r.body).slice(0,200));
              const j=JSON.parse(r.body),oferta=(j.offers||[])[0];
              c.cakto={link:oferta?`https://pay.cakto.com.br/${oferta.id}`:'',id:j.id};save();render();
              toast('Produto postado na Cakto!')}
            catch(e){toast('Erro: '+e.message)}}

          // ---------- Telas ----------
          const IC={chat:'M4 5h16v11H9l-5 4z',cursos:'M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11',videos:'M4 6h12v12H4zM16 9l4-3v12l-4-3',lojas:'M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6',cfg:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4'};
          function nav(){const t=[['chat','Chat'],['cursos','Cursos ('+S.cursos.length+')'],['videos','Vídeos'],['lojas','Lojas'],['cfg','Ajustes']];
            $('#nav').innerHTML=t.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()"><svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>${n}</button>`).join('')}
          function render(){nav();$('#main').className=S.tab==='chat'?'chat':'';({chat:vChat,cursos:vCursos,videos:vVideos,lojas:vLojas,cfg:vCfg})[S.tab]()}
          const hist=()=>S.feed.filter(m=>m.t==='u'||m.t==='ai').slice(-12).map(m=>({role:m.t==='u'?'user':'assistant',content:m.txt}));
          function vChat(){
            $('#main').innerHTML=`<div id="feed"></div><div id="ctl" class="chips"></div>
            <div class="chips"><span class="chip" onclick="chip('curso')">+ Novo curso</span><span class="chip" onclick="chip('auto')">Piloto automático</span><span class="chip" onclick="chip('afil')">Afiliação</span><span class="chip ${S.web?'on':''}" onclick="S.web=!S.web;vChat()">Pesquisar demanda</span><span class="chip" onclick="S.feed=[];save();hello();">Limpar</span></div>
            <div class="bar"><textarea id="in" rows="1" placeholder="Escreva um tema, uma ideia ou uma pergunta"></textarea><button class="go" id="sd">Enviar</button></div>`;
            $('#sd').onclick=enviar;renderFeed();ctlBar()}
          function hello(){post('ai',`Oi! Eu sou o **Vendedor YoYo**. ${hasChave()?'Estou usando '+NOME[provedor(A.ler('chave'))]+' como motor de IA.':'Estou no modo **Off-AI**: funciono sem nenhuma chave, usando pesquisa real do Google e um gerador próprio. Cole uma chave em Ajustes se quiser respostas mais inteligentes.'}\n\nPesquiso o que as pessoas procuram, crio cursos originais de R$ 10 a R$ 50, com capa, slides e vídeo narrado. Antes de cada etapa eu peço sua aprovação, e pergunto se é para vender na Kiwify, na Shopify ou na Cakto — na Cakto eu posso postar o produto automaticamente em um clique.\n\nAutorize a IA no topo para eu começar.`,{bt:[['Criar um curso','modo:curso'],['Piloto automático','auto:3']]})}
          function chip(k){
            if(k==='curso')return acao('modo:curso');
            if(k==='auto')post('ai','Quantos cursos quer que eu crie no piloto automático?',{bt:[['1 curso','auto:1'],['3 cursos','auto:3'],['5 cursos','auto:5']]});
            if(k==='afil')post('ai','Como posso ajudar na afiliação?',{bt:[['Pedir afiliação','modo:afil_pedido'],['Responder produtor','modo:afil_resp'],['Kit de divulgação','modo:afil_kit']]})}
          function acao(c){const [k,v]=c.split(':');
            if(k==='auto')auto(+v);
            else if(k==='modo'){S.modo=v;post('ai',{curso:'Qual é o tema ou nicho do curso? Pode ser bem específico.',afil_pedido:'Conte o produto e o produtor. Eu preparo a mensagem de pedido, o plano e as respostas prontas. Mantenha o seu perfil de afiliado atualizado em Ajustes.',afil_resp:'Cole aqui a mensagem que o produtor enviou.',afil_kit:'Qual produto você vai divulgar?'}[v])}
            else if(k==='copiar')copiar(S.feed.find(x=>x.id==v).txt);
            else if(k==='share')A.compartilhar(S.feed.find(x=>x.id==v).txt);
            else if(k==='ver'){S.tab='cursos';render()}}
          async function enviar(){const el=$('#in'),v=el.value.trim();if(!v)return;el.value='';post('u',v);
            const ab=S.feed.filter(m=>m.t==='ask'&&m.est==='aberto').pop();
            if(ab)return fechaAsk(ab.id,'idea',v),void 0;
            if(!auth())return post('ai','A IA está desligada. Toque em 30 min, 1 h ou 2 h no topo para autorizar e eu respondo.');
            if(S.busy)return toast('Aguarde a resposta anterior');
            const md=S.modo;S.modo='chat';
            if(md==='curso')return iniciar([v]);
            if(md.startsWith('afil_'))return afil(md,v);
            if(!hasChave())return post('ai','No modo Off-AI eu não converso livremente — mas crio cursos completos. Toque em "+ Novo curso" e me diga o tema.');
            S.busy=true;renderFeed();
            try{let h=hist();if(S.web){const p=await pesquisar(v);h=[{role:'user',content:'Dados de pesquisa (use só o que ajudar):\n'+p},...h]}
              post('ai',await ia(h))}catch(e){post('ai','Erro: '+e.message)}
            S.busy=false;renderFeed()}
          function vCursos(){
            $('#main').innerHTML=S.cursos.length?S.cursos.map(c=>`<div class="card"><img class="capa" src="${capaURL(c)}" alt="Capa do curso"><h3>${esc(c.titulo)}</h3><p class="mut">${esc(c.subtitulo)}</p>
              <div class="row"><span class="price">R$ ${preco(c)}</span><span class="chip">${esc(c.tema)}</span><span class="chip on">${PLAT[c.plataforma]||c.plataforma}</span>${c.nota?`<span class="chip">potencial ${esc(c.nota)}/10</span>`:''}${c.shopify?'<span class="chip on">enviado</span>':''}${c.cakto?'<span class="chip on">postado</span>':''}</div>
              <details><summary>Módulos e aulas</summary>${(c.modulos||[]).map(m=>`<p><b>${esc(m.nome)}</b></p>${(m.aulas||[]).map(a=>`<p class="mut">• ${esc(a.titulo)}</p>`).join('')}`).join('')}</details>
              <details><summary>Slides (${(c.slides||[]).length})</summary>${slidesHTML(c)}<div class="row"><button class="sec" onclick="copiar(slidesTxt(S.cursos.find(x=>x.id=='${c.id}')))">Copiar roteiro</button><button class="sec" onclick="compartilharCurso('${c.id}')">Enviar a outro app de IA</button><button class="go" onclick="criarVideoCurso('${c.id}')">Criar vídeo narrado</button></div></details>
              <details><summary>Página de vendas</summary><p class="mut" style="white-space:pre-wrap">${esc(c.pagina_vendas)}</p></details>
              <details><summary>Anúncios</summary>${(c.anuncios||[]).map(a=>`<p class="mut">${esc(a)}</p>`).join('')}</details>
              ${c.cakto&&c.cakto.link?`<p class="link">Link de pagamento: ${esc(c.cakto.link)}</p>`:''}
              <div class="row">${c.plataforma==='cakto'?`<button class="one" onclick="enviarCakto('${c.id}')">${c.cakto?'Postar de novo na Cakto':'Postar na Cakto (1 clique)'}</button>`:c.plataforma==='shopify'?`<button class="go" onclick="enviarShopify('${c.id}')">Enviar à Shopify</button>`:`<button class="go" onclick="copiar(textoCurso(S.cursos.find(x=>x.id=='${c.id}')))">Copiar para Kiwify</button>`}<button class="sec" onclick="salvarCapa('${c.id}')">Salvar capa</button><button class="sec" onclick="S.cursos=S.cursos.filter(x=>x.id!='${c.id}');save();render()">Excluir</button></div></div>`).join('')
              +`<p class="mut" style="padding:8px">Kiwify: crie o produto no painel e cole o conteúdo. Shopify: vai como rascunho, e você revisa e publica. Cakto: um clique já cria o produto, checkout e link de pagamento reais.</p>`
              :'<div class="card"><h3>Nenhum curso ainda</h3><p class="mut">Volte ao Chat e peça um curso.</p></div>'}
          function vLojas(){
            $('#main').innerHTML=`<div class="card"><h3>Kiwify</h3><p class="mut">Mostra seus produtos e as vendas dos últimos 30 dias. Somente leitura: o app não cria, reembolsa nem saca nada.</p>
              <div class="row"><button class="go" id="kb" ${S.busy?'disabled':''}>Atualizar painel</button></div>
              <p class="mut" style="margin-top:12px">${S.loja||'Cadastre suas credenciais em Ajustes.'}</p></div>
              <div class="card"><h3>Shopify</h3><p class="mut">Em Cursos, toque em Enviar à Shopify e confirme. O produto é criado como rascunho. Loja: <b>${esc(A.ler('sdom')||'não conectada')}</b></p>
              <p class="mut" style="margin-top:8px">Para entregar o curso ao comprador, use um app de produtos digitais da Shopify.</p></div>
              <div class="card"><h3>Cakto</h3><p class="mut">Em Cursos, com a plataforma Cakto escolhida, um clique cria o produto, a oferta padrão, o checkout e o link de pagamento reais — já usando a API oficial de escrita da Cakto. Cadastre client_id e client_secret em Ajustes, com os escopos "write products" e "write offers".</p></div>`;
            const b=$('#kb');if(b)b.onclick=painelKiwify}
          function vCfg(){
            const t=(id,l,ph,tipo='password')=>`<label>${l}</label><input id="${id}" type="${tipo}" placeholder="${A.ler(id)&&tipo==='password'?'Salvo no cofre do Android':ph}" ${tipo==='text'?`value="${esc(A.ler(id))}"`:''}>`;
            const k=A.ler('chave');
            $('#main').innerHTML=`<div class="card"><h3>Chave de IA (opcional)</h3><p class="mut">Cole a chave de qualquer provedor: OpenAI, Anthropic (Claude), Google (Gemini) ou Groq. O app detecta sozinho qual é e já usa. Sem chave, funciona no modo Off-AI (sem nenhuma IA paga).</p>
              <label>Chave</label><input id="chave" type="password" placeholder="${k?'Detectada: '+NOME[provedor(k)]:'sk-..., sk-ant-..., AIza..., gsk_...'}">
              <label>Modelo da OpenAI (se usar OpenAI)</label><input id="omod" value="${esc(A.ler('omod')||'gpt-4o-mini')}"></div>
              <div class="card"><h3>Bolinha flutuante</h3><p class="mut">Uma bolinha de dinheiro fica sobre qualquer app, com Parar, Continuar e Fechar. Exige "Exibir sobre outros apps" e só desenha a bolinha. Verde: trabalhando. Âmbar: esperando aprovação. Vermelho: parado.</p>
              <div class="row"><button class="go" id="bo">Ativar bolinha</button><button class="sec" id="bx">Desativar</button></div><p class="mut" id="bm"></p></div>
              <div class="card"><h3>Perfil de afiliado</h3><p class="mut">Escreva só o que é verdade: canais, público, experiência e métodos.</p>
              <label>Seu perfil</label><textarea id="perfil" rows="5" placeholder="Ex.: Tenho um Instagram de finanças pessoais...">${esc(localStorage.getItem('perfil')||'')}</textarea></div>
              <div class="card"><h3>Cérebro</h3><p class="mut">Ideias e aprendizados usados nos próximos cursos.</p>
              ${S.mem.map((m,i)=>`<div class="row"><span class="mut" style="flex:1">${esc(m)}</span><button class="sec" onclick="S.mem.splice(${i},1);save();vCfg()">Apagar</button></div>`).join('')||'<p class="mut">Ainda vazio.</p>'}
              <div class="row"><input id="nm" placeholder="Adicionar regra ou preferência"><button class="sec" id="am">Adicionar</button></div></div>
              <div class="card"><h3>Kiwify</h3>${t('kid','client_id','Painel da Kiwify > Apps > API')}${t('ksec','client_secret','Guarde com cuidado')}${t('kacc','ID da conta (se pedir)','Opcional','text')}</div>
              <div class="card"><h3>Shopify</h3>${t('sdom','Loja','minha-loja.myshopify.com','text')}${t('stok','Token da Admin API','Escopo write_products')}</div>
              <div class="card"><h3>Cakto</h3><p class="mut">Painel da Cakto → Integrações → Cakto API. Crie uma chave com os escopos "write products" e "write offers".</p>${t('cid','client_id','Da Cakto')}${t('csec','client_secret','Guarde com cuidado')}</div>
              <div class="row"><button class="go" id="sv">Salvar tudo</button></div><p class="mut" id="ms"></p>
              <div class="card"><h3>Segurança</h3><p class="mut">A IA só trabalha com a autorização ativa, checada no código nativo, e expira sozinha. Cada etapa pede sua aprovação. O app só fala com: IA (se você colar chave), buscas do Google, Wikipédia, Kiwify (somente leitura), a sua loja Shopify e a Cakto (só para criar o produto que você aprovar). Não lê arquivos, contatos, outros apps nem dados bancários, e não há campo de senha ou conta bancária. O dinheiro fica nas plataformas, e só você saca. Chaves ficam criptografadas no cofre do Android.</p></div>
              <div class="card"><h3>Limites honestos</h3><p class="mut">O app não loga nem posta sozinho em redes sociais — isso violaria os termos delas. Os vídeos são sempre marcados como criados com IA, e você mesmo baixa e publica. A Kiwify só permite leitura pela API dela; a Shopify cria rascunho; a Cakto é a única com publicação real em um clique, sempre com sua confirmação antes. Revise todo curso antes de vender. Não há garantia de vendas.</p></div>`;
            $('#bo').onclick=()=>{const r=A.bolha(true);$('#bm').textContent=r==='perm'?'Permita "Exibir sobre outros apps", volte e toque em Ativar bolinha de novo.':'Bolinha ativa. Saia do app para vê-la.'};
            $('#bx').onclick=()=>{A.bolha(false);$('#bm').textContent='Bolinha desativada.'};
            $('#am').onclick=()=>{const v=$('#nm').value.trim();if(v){memAdd(v);vCfg()}};
            $('#sv').onclick=()=>{const nova=$('#chave').value.trim();if(nova)A.gravar('chave',nova);
              A.gravar('omod',$('#omod').value.trim());
              ['kid','ksec','kacc','sdom','stok','cid','csec'].forEach(k2=>{let v=$('#'+k2).value.trim();if(k2==='sdom')v=v.replace(/^https?:\/\//,'').replace(/\/.*$/,'').toLowerCase();if(v||k2==='kacc')A.gravar(k2,v)});
              localStorage.setItem('perfil',$('#perfil').value.trim());KT=null;CKT=null;
              $('#ms').innerHTML=`<span class="ok">Salvo.${nova?' Detectei: '+NOME[provedor(nova)]+'.':''}</span>`}}
          if(!S.feed.length)hello();else if(S.fila.length||S.job)post('ai','Há uma produção pausada. Autorize a IA e toque em Continuar.');
          autBar();render();estado();
          </script></body></html>
          HTML
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vendedor YoYo v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
