          cat > app/src/main/java/app/cursoia/VideoMaker.kt <<'KT'
          package app.cursoia

          import android.graphics.Bitmap
          import android.media.*
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer

          // Monta um MP4 a partir de slides estáticos + narração por voz (TextToSpeech), sem usar nenhuma API paga.
          // Gera em tempo real (um vídeo de 2 minutos demora cerca de 2 minutos para ficar pronto).
          class VideoMaker {
            data class Amostra(val dados: ByteArray, val info: MediaCodec.BufferInfo)

            private fun lerWav(f: File): Triple<Int, Int, ByteArray> {
              val raf = RandomAccessFile(f, "r")
              val b = ByteArray(f.length().toInt()); raf.readFully(b); raf.close()
              var pos = 12; var taxa = 22050; var canais = 1; var dadosOff = -1; var dadosLen = 0
              while (pos + 8 <= b.size) {
                val id = String(b, pos, 4, Charsets.US_ASCII)
                val tam = (b[pos + 4].toInt() and 255) or ((b[pos + 5].toInt() and 255) shl 8) or ((b[pos + 6].toInt() and 255) shl 16) or ((b[pos + 7].toInt() and 255) shl 24)
                if (id == "fmt ") {
                  canais = (b[pos + 10].toInt() and 255) or ((b[pos + 11].toInt() and 255) shl 8)
                  taxa = (b[pos + 12].toInt() and 255) or ((b[pos + 13].toInt() and 255) shl 8) or ((b[pos + 14].toInt() and 255) shl 16) or ((b[pos + 15].toInt() and 255) shl 24)
                } else if (id == "data") { dadosOff = pos + 8; dadosLen = tam }
                pos += 8 + tam + (tam and 1)
              }
              val pcm = if (dadosOff >= 0) b.copyOfRange(dadosOff, minOf(b.size, dadosOff + dadosLen)) else ByteArray(0)
              return Triple(taxa, canais, pcm)
            }

            private fun codificarAudio(pcm: ByteArray, taxa: Int, canais: Int): Pair<MediaFormat, List<Amostra>> {
              val fmt = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, taxa, canais)
              fmt.setInteger(MediaFormat.KEY_BIT_RATE, 96000)
              fmt.setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
              fmt.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 8192)
              val cod = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
              cod.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE); cod.start()
              val saida = ArrayList<Amostra>(); var formatoFinal = fmt
              var enviado = 0; val bytesPorAmostra = 2 * canais; var acabou = false
              val bi = MediaCodec.BufferInfo()
              while (!acabou) {
                if (enviado < pcm.size) {
                  val ib = cod.dequeueInputBuffer(10000)
                  if (ib >= 0) {
                    val buf = cod.getInputBuffer(ib)!!; buf.clear()
                    val n = minOf(buf.capacity(), pcm.size - enviado)
                    buf.put(pcm, enviado, n)
                    val pts = (enviado.toLong() * 1000000L) / (taxa * bytesPorAmostra)
                    enviado += n
                    val flag = if (enviado >= pcm.size) MediaCodec.BUFFER_FLAG_END_OF_STREAM else 0
                    cod.queueInputBuffer(ib, 0, n, pts, flag)
                  }
                }
                var ob = cod.dequeueOutputBuffer(bi, 10000)
                while (ob >= 0) {
                  if (bi.size > 0) {
                    val out = cod.getOutputBuffer(ob)!!; val arr = ByteArray(bi.size); out.get(arr)
                    saida.add(Amostra(arr, MediaCodec.BufferInfo().apply { set(0, arr.size, bi.presentationTimeUs, bi.flags) }))
                  }
                  val fim = (bi.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0
                  cod.releaseOutputBuffer(ob, false)
                  if (fim) { acabou = true; break }
                  ob = cod.dequeueOutputBuffer(bi, 10000)
                }
                if (ob == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) formatoFinal = cod.outputFormat
              }
              cod.stop(); cod.release()
              return Pair(formatoFinal, saida)
            }

            fun gerar(slides: List<Pair<Bitmap, File>>, saidaMp4: File, largura: Int = 1280, altura: Int = 720) {
              val amostrasAudio = ArrayList<Amostra>(); var formatoAudio: MediaFormat? = null; var tAudio = 0L
              val quadros = ArrayList<Pair<Bitmap, Long>>()
              for ((bmp, wav) in slides) {
                val (taxa, canais, pcm) = lerWav(wav)
                val dur = if (pcm.isNotEmpty()) (pcm.size.toLong() * 1000000L) / (taxa * canais * 2) else 1500000L
                if (pcm.isNotEmpty()) {
                  val (f, am) = codificarAudio(pcm, taxa, canais)
                  if (formatoAudio == null) formatoAudio = f
                  am.forEach { a -> a.info.presentationTimeUs += tAudio; amostrasAudio.add(a) }
                }
                quadros.add(Pair(bmp, dur))
                tAudio += dur
              }

              val vfmt = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, largura, altura)
              vfmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
              vfmt.setInteger(MediaFormat.KEY_BIT_RATE, 3000000)
              vfmt.setInteger(MediaFormat.KEY_FRAME_RATE, 2)
              vfmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 2)
              val vcod = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
              vcod.configure(vfmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
              val surface = vcod.createInputSurface(); vcod.start()

              val amostrasVideo = ArrayList<Amostra>(); var formatoVideo: MediaFormat? = null
              val bi = MediaCodec.BufferInfo()
              fun drenar(fim: Boolean) {
                var ob = vcod.dequeueOutputBuffer(bi, 0)
                while (ob >= 0) {
                  if (bi.size > 0 && (bi.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0) {
                    val out = vcod.getOutputBuffer(ob)!!; val arr = ByteArray(bi.size); out.get(arr)
                    amostrasVideo.add(Amostra(arr, MediaCodec.BufferInfo().apply { set(0, arr.size, bi.presentationTimeUs, bi.flags) }))
                  }
                  vcod.releaseOutputBuffer(ob, false)
                  ob = vcod.dequeueOutputBuffer(bi, 0)
                }
                if (ob == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) formatoVideo = vcod.outputFormat
              }
              for ((bmp, dur) in quadros) {
                val canvas = surface.lockHardwareCanvas()
                val rb = android.graphics.RectF(0f, 0f, largura.toFloat(), altura.toFloat())
                canvas.drawColor(android.graphics.Color.BLACK)
                canvas.drawBitmap(bmp, null, rb, null)
                surface.unlockCanvasAndPost(canvas)
                drenar(false)
                val passos = maxOf(1, (dur / 400000).toInt())
                for (i in 0 until passos) { Thread.sleep(400); drenar(false) }
              }
              vcod.signalEndOfInputStream()
              var tentativas = 0
              while (tentativas < 200) { drenar(true); if (formatoVideo != null && amostrasVideo.any { (it.info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0 }) break; Thread.sleep(20); tentativas++ }
              vcod.stop(); vcod.release(); surface.release()

              val mux = MediaMuxer(saidaMp4.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
              val tv = mux.addTrack(formatoVideo ?: vfmt)
              val ta = if (formatoAudio != null) mux.addTrack(formatoAudio!!) else -1
              mux.start()
              val bb = MediaCodec.BufferInfo()
              for (a in amostrasVideo) if ((a.info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) == 0) {
                bb.set(0, a.dados.size, a.info.presentationTimeUs, a.info.flags)
                mux.writeSampleData(tv, ByteBuffer.wrap(a.dados), bb)
              }
              if (ta >= 0) for (a in amostrasAudio) {
                bb.set(0, a.dados.size, a.info.presentationTimeUs, a.info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM.inv())
                mux.writeSampleData(ta, ByteBuffer.wrap(a.dados), bb)
              }
              mux.stop(); mux.release()
            }
          }
          KT
