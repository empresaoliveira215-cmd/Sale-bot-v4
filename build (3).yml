                    tmp.delete(); uri = u
                  } catch (e: Exception) { erro = e.message ?: "Falha ao criar o vídeo" }
                  val out = JSONObject().put("ok", erro.isEmpty()).put("uri", uri?.toString() ?: "").put("erro", erro).toString()
                  runOnUiThread { wv.evaluateJavascript("window.retornoVideo(" + JSONObject.quote(id) + "," + JSONObject.quote(out) + ")", null) }
                }.start()
              }
