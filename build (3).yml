          // Pilha de dinheiro verde cartoon com moeda de destaque + ponto de status (verde rodando, âmbar aguardando aprovação, vermelho parado, cinza ocioso).
          class Dinheiro(c: Context) : View(c) {
            var estado = 0xFF9E9E9E.toInt()
            private val p = Paint(Paint.ANTI_ALIAS_FLAG)
            private val traco = Color.parseColor("#123F18")
            override fun onDraw(cv: Canvas) {
              val s = width / 100f
              fun rr(l: Float, t: Float, r: Float, b: Float, cor: String) {
                p.style = Paint.Style.FILL; p.color = Color.parseColor(cor)
                cv.drawRoundRect(l * s, t * s, r * s, b * s, 7 * s, 7 * s, p)
                p.style = Paint.Style.STROKE; p.strokeWidth = 3f * s; p.color = traco
                cv.drawRoundRect(l * s, t * s, r * s, b * s, 7 * s, 7 * s, p)
              }
              p.style = Paint.Style.FILL; p.color = 0x44000000
              cv.drawOval(10 * s, 84 * s, 90 * s, 97 * s, p)
              for (i in 0..3) rr(8f, 61f - i * 13f, 92f, 83f - i * 13f, arrayOf("#2E9E3E", "#3DBA4C", "#2E9E3E", "#7EE878")[i])
              p.style = Paint.Style.FILL; p.color = Color.parseColor("#FFF3C4")
              cv.drawCircle(50 * s, 33 * s, 10 * s, p)
              p.style = Paint.Style.STROKE; p.strokeWidth = 2.4f * s; p.color = traco
              cv.drawCircle(50 * s, 33 * s, 10 * s, p)
              p.style = Paint.Style.FILL; p.color = Color.parseColor("#F5B544"); p.textSize = 16 * s; p.typeface = Typeface.DEFAULT_BOLD; p.textAlign = Paint.Align.CENTER
              cv.drawText("$", 50 * s, 38.5f * s, p)
              p.color = 0x55FFFFFF; cv.drawRect(16 * s, 24 * s, 34 * s, 27 * s, p)
              p.color = estado; cv.drawCircle(86 * s, 16 * s, 9 * s, p)
              p.style = Paint.Style.STROKE; p.strokeWidth = 2.5f * s; p.color = Color.WHITE; cv.drawCircle(86 * s, 16 * s, 9 * s, p)
            }
          }

          class Bolha : Service() {
            companion object {
              var wv: WebView? = null
              var inst: Bolha? = null
              fun pintar(c: Int) { Handler(Looper.getMainLooper()).post { inst?.bola?.let { it.estado = c; it.invalidate() } } }
            }
            private lateinit var wm: WindowManager
            private lateinit var raiz: LinearLayout
            private lateinit var painel: LinearLayout
            var bola: Dinheiro? = null

            override fun onBind(i: Intent?): IBinder? = null
            override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_NOT_STICKY

            override fun onCreate() {
              super.onCreate(); inst = this
              val nm = getSystemService(NotificationManager::class.java)
              nm.createNotificationChannel(NotificationChannel("b", "Bolinha", NotificationManager.IMPORTANCE_LOW))
              val n = Notification.Builder(this, "b").setContentTitle("Vendedor YoYo")
                .setContentText("Bolinha flutuante ativa").setSmallIcon(android.R.drawable.star_on).build()
              if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE) else startForeground(1, n)
              montar()
            }

            private fun cmd(a: String) { Handler(Looper.getMainLooper()).post { wv?.evaluateJavascript("window.ctl('$a')", null) } }

            private fun montar() {
              wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              val d = resources.displayMetrics.density
              val larg = resources.displayMetrics.widthPixels
              raiz = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL }
              val b = Dinheiro(this); bola = b
              raiz.addView(b, LinearLayout.LayoutParams((66 * d).toInt(), (66 * d).toInt()))
              painel = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL; visibility = View.GONE
                setPadding((8 * d).toInt(), (8 * d).toInt(), (8 * d).toInt(), (8 * d).toInt())
                background = GradientDrawable().apply { setColor(0xF2201C3B.toInt()); cornerRadius = 18 * d }
              }
              fun botao(t: String, cor: Int, f: () -> Unit) {
                val bt = Button(this).apply {
                  text = t; isAllCaps = false; setTextColor(Color.WHITE); textSize = 14f
                  background = GradientDrawable().apply { setColor(cor); cornerRadius = 12 * d }
                  setOnClickListener { f() }
                }
                val lp = LinearLayout.LayoutParams((136 * d).toInt(), (44 * d).toInt()); lp.setMargins(0, (3 * d).toInt(), 0, (3 * d).toInt())
                painel.addView(bt, lp)
              }
              botao("⏸  Parar", 0xFFE53935.toInt()) { cmd("stop") }
              botao("▶  Continuar", 0xFF2E9E3E.toInt()) { cmd("continue") }
              botao("✕  Fechar", 0xFF4A4570.toInt()) { painel.visibility = View.GONE }
              raiz.addView(painel)
              val lp = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
              lp.gravity = Gravity.TOP or Gravity.START; lp.x = (12 * d).toInt(); lp.y = (180 * d).toInt()
              var ix = 0; var iy = 0; var tx = 0f; var ty = 0f; var moveu = false
              b.setOnTouchListener { _, e ->
                when (e.action) {
                  MotionEvent.ACTION_DOWN -> {
                    ix = lp.x; iy = lp.y; tx = e.rawX; ty = e.rawY; moveu = false
                    b.animate().scaleX(1.14f).scaleY(1.14f).setDuration(120).start(); true
                  }
                  MotionEvent.ACTION_MOVE -> {
                    val dx = e.rawX - tx; val dy = e.rawY - ty
                    if (abs(dx) > 10 || abs(dy) > 10) moveu = true
                    if (moveu) { lp.x = ix + dx.toInt(); lp.y = iy + dy.toInt(); wm.updateViewLayout(raiz, lp) }
                    true
                  }
                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                    b.animate().scaleX(1f).scaleY(1f).setDuration(160).start()
                    if (!moveu && e.action == MotionEvent.ACTION_UP) {
                      painel.visibility = if (painel.visibility == View.GONE) View.VISIBLE else View.GONE
                      if (painel.visibility == View.VISIBLE) lp.x = minOf(lp.x, larg - (160 * d).toInt())
                      wm.updateViewLayout(raiz, lp)
                    }
                    true
                  }
                  else -> false
                }
              }
              wm.addView(raiz, lp)
            }

            override fun onDestroy() {
              try { wm.removeView(raiz) } catch (e: Exception) {}
              inst = null; super.onDestroy()
            }
          }
