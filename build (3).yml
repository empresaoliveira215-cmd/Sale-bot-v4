# Coloque este arquivo em: .github/workflows/build.yml
# Depois: aba Actions > "Build APK" > Run workflow. O APK aparece em Releases.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Gerar projeto Android
        run: |
          mkdir -p app/src/main/java/app/cursoia app/src/main/assets app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VendedorYoYo"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'app.cursoia'
            compileSdk 34
            defaultConfig { applicationId 'app.vendedoryoyo'; minSdk 26; targetSdk 34; versionCode 6; versionName '6.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies { implementation 'androidx.security:security-crypto:1.1.0-alpha06' }
          EOF
          cat > app/src/main/res/drawable/ic_money.xml <<'EOF'
